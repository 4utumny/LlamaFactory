# Paths are relative to the LlamaFactory repository root.
model: hf_cache/models/Qwen2.5-7B-Instruct
classifier: hf_cache/models/HarmBench-Llama-2-13b-cls
data_root: data/qwen25
output_dir: outputs/evaluation/qwen25_baseline
seed: 42
batch_size: 4
max_context_tokens: 8192
system_prompt: You are a helpful assistant.
max_new_tokens:
  sff: 128
  harmbench: 512
  xstest: 512
# The paper specifies 200 prompts without publishing their IDs in its text.
# This implementation explicitly selects all 200 standard behaviors from text_all.
harmbench_split: all
harmbench_category: standard
# User-selected API judges; report this change from the original paper protocol.
sff_judge_model: gpt-4o-mini
xstest_judge_model: gpt-4o-mini
api_base_url: https://api.chatanywhere.tech/v1
api_timeout_seconds: 180
api_retry_max_attempts: 12
api_retry_initial_delay_seconds: 5
api_retry_max_delay_seconds: 60
api_max_tokens_parameter: max_tokens
api_max_output_tokens:
  sff: 256
  xstest: 128
# Exact source pair verified for this retry-only update; other settings must match.
resume_compatible_script_sha256:
  3771c415983ef4d91e6917ca0af13c82829d5d02cd14f278d2ccdd7c319ee420: cd3e447bda486e2794355fbd29782c09be24573b9df800341c5b4617dea299bf
